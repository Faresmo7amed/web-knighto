<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.da *{box-sizing:border-box}
.da a{color:var(--ac)}
.inp{min-height:48px;width:100%;border:1px solid var(--bds);background:var(--surf);color:var(--tx);border-radius:8px;padding:0 12px;font-size:16px;font-family:'DM Sans',system-ui,sans-serif}
.inp.err{border-color:var(--dan)}
.inp.foc{border-color:var(--ac);outline:2px solid var(--acs)}
.fl{font-size:14px;line-height:20px;font-weight:600;color:var(--tx)}
.em{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--dan)}
.hp{font-size:13px;line-height:18px;color:var(--txm)}
.card{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--sh)}
.pbtn{min-height:48px;width:100%;border:0;border-radius:8px;background:var(--ac);color:var(--acc);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.pbtn.dis{opacity:0.45;cursor:not-allowed}
.sbtn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--bds);background:var(--surf);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.box{width:48px;height:56px;border:1px solid var(--bds);border-radius:10px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:var(--tx)}
.box.foc{border-color:var(--ac);outline:2px solid var(--acs)}
.ib{width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--txm);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.bdg{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--acs);color:var(--ac)}
</style>
</helmet>
<div class="da" style="--bg:#F8F9FB;--bgs:#F0F2F6;--surf:#FCFCFD;--surfh:#F3F5F9;--bd:#E1E5EC;--bds:#C9D0DB;--tx:#1A1D23;--txm:#565E6D;--txf:#646C7B;--ac:#2F6FCB;--ach:#255DAF;--acs:#E3EDFB;--acc:#FFFFFF;--ok:#2E7D4F;--warn:#9A6700;--dan:#C03A3A;--danc:#FFFFFF;--inf:#1F7A99;--cb:#F0F2F6;--cbd:#DDE2EA;--sel:#CFE0F8;--h0:#E6E9EF;--h1:#C7DAF6;--h2:#93B8EE;--h3:#5C92E0;--h4:#2F6FCB;--sh:0 4px 12px rgba(26,29,35,0.08),0 1px 3px rgba(26,29,35,0.05);--tip:#1A1D23;--tipt:#F8F9FB;--k:#6F42C1;--f:#1B63B8;--s:#3C7D14;--p:#4A5160;--a:#B45F06;--t:#C2303D;--c:#5F6877;--n:#9A6700;width:100%;max-width:1440px;margin:0 auto;min-height:860px;background:var(--bgs);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:48px 24px">
<div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;font-weight:700;letter-spacing:-0.01em">[Site name]</span><span class="bdg">Dashboard</span></div><div class="card" style="max-width:440px">
<span style="width:48px;height:48px;border-radius:12px;background:var(--acs);color:var(--ac);display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:30px;line-height:38px;letter-spacing:-0.01em;font-weight:600">Two-step verification</h1><p style="margin:0;font-size:15px;line-height:22px;color:var(--txm)">Enter the 6-digit code from your authenticator app.</p></div>
<div role="group" aria-label="6-digit code" style="display:flex;gap:8px;justify-content:space-between"><span class="box">4</span><span class="box">8</span><span class="box">1</span><span class="box">7</span><span class="box foc"><span style="width:2px;height:26px;background:var(--ac)"></span></span><span class="box"></span></div>
<label style="display:flex;gap:10px;align-items:center;min-height:32px;font-size:15px"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--ac)">Trust this device for 30 days</label>
<button class="pbtn dis" aria-disabled="true">Verify</button>
<div style="display:flex;flex-direction:column;gap:2px;align-items:center"><a href="#" style="font-size:15px;font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center">Use a recovery code instead</a><a href="#" style="font-size:14px;text-decoration:none;color:var(--txm);min-height:44px;display:inline-flex;align-items:center">Cancel and sign out</a></div>
</div><a href="#" style="font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg> Back to site</a>
</div>
</x-dc>
