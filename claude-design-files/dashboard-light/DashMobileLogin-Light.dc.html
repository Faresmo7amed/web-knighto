<style>
body{margin:0}
.da *{box-sizing:border-box}
.da a{color:var(--ac)}
.inp{min-height:48px;width:100%;border:1px solid var(--bds);background:var(--surf);color:var(--tx);border-radius:8px;padding:0 12px;font-size:16px;font-family:'DM Sans',system-ui,sans-serif}

.pbtn{min-height:48px;width:100%;border:0;border-radius:8px;background:var(--ac);color:var(--acc);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.pbtn.dis{opacity:0.45;cursor:not-allowed}
.sbtn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--bds);background:var(--surf);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.box{width:48px;height:56px;border:1px solid var(--bds);border-radius:10px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;color:var(--tx)}
.box.foc{border-color:var(--ac);outline:2px solid var(--acs)}
.ib{width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--txm);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.bdg{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--acs);color:var(--ac)}
</style>

<div class="da" style="--bg:#F8F9FB;--bgs:#F0F2F6;--surf:#FCFCFD;--surfh:#F3F5F9;--bd:#E1E5EC;--bds:#C9D0DB;--tx:#1A1D23;--txm:#565E6D;--txf:#646C7B;--ac:#2F6FCB;--ach:#255DAF;--acs:#E3EDFB;--acc:#FFFFFF;--ok:#2E7D4F;--warn:#9A6700;--dan:#C03A3A;--danc:#FFFFFF;--inf:#1F7A99;--cb:#F0F2F6;--cbd:#DDE2EA;--sel:#CFE0F8;--h0:#E6E9EF;--h1:#C7DAF6;--h2:#93B8EE;--h3:#5C92E0;--h4:#2F6FCB;--sh:0 4px 12px rgba(26,29,35,0.08),0 1px 3px rgba(26,29,35,0.05);--tip:#1A1D23;--tipt:#F8F9FB;--k:#6F42C1;--f:#1B63B8;--s:#3C7D14;--p:#4A5160;--a:#B45F06;--t:#C2303D;--c:#5F6877;--n:#9A6700;width:100%;max-width:1440px;margin:0 auto;min-height:844px;background:var(--bgs);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 16px">
<div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;font-weight:700;letter-spacing:-0.01em">[Site name]</span><span class="bdg">Dashboard</span></div><div class="card" style="max-width:440px;padding:20px">
<div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:26px;line-height:34px;letter-spacing:-0.01em;font-weight:600">Sign in</h1><p style="margin:0;font-size:15px;line-height:22px;color:var(--txm)">Dashboard access is limited to the site owner.</p></div>
<div role="alert" style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1px solid var(--dan);background:var(--surfh)"><span style="color:var(--dan);display:flex;padding-top:1px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg></span><div style="font-size:14px;line-height:20px"><b>Email or password is incorrect.</b><div style="color:var(--txm)">3 attempts left before sign-in is locked for 15 minutes.</div></div></div>

<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><label class="fl" for="p">Password</label><a href="#" style="font-size:14px;font-weight:600;text-decoration:none">Forgot password?</a></div><div style="position:relative"><input id="p" class="inp err" type="password" value="••••••••••" autocomplete="current-password" style="padding-right:52px"><button class="ib" aria-label="Show password" style="position:absolute;right:2px;top:2px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div>
<button class="pbtn">Sign in</button>
<div style="display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--txm)"><span style="color:var(--txf);display:flex"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>Sign-in is rate limited. Every attempt is recorded in the activity log.</div>

</div>
