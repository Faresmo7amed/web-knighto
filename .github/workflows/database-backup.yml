name: Weekly database backup

on:
  schedule:
    - cron: '40 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create compressed backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" > knowledge-site-$(date +%F).dump
      - name: Store backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-site-database-${{ github.run_id }}
          path: knowledge-site-*.dump
          retention-days: 30
